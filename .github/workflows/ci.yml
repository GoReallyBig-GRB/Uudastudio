name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Type-check, test, and build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Verify runtime versions
        run: |
          node --version
          bun --version

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Verify React and TypeScript installation
        run: bun pm ls

      - name: Type-check
        run: bun run lint

      - name: Run tests
        run: bun run test

      - name: Build application and server
        run: bun run build:all

  deploy-cloudflare:
    name: Deploy frontend and API proxy to Cloudflare Workers
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.CLOUDFLARE_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Build React application
        run: bun run build

      - name: Deploy to Cloudflare Workers
        run: bun run deploy:cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
