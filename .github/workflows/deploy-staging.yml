name: Deploy staging

# Puts the branch on a private test address (uuda-studio-staging.<account>.workers.dev) so the real Cloudflare setup can be tested.
# Runs only after the repository variable CLOUDFLARE_STAGING_ENABLED is "true" and the two Cloudflare secrets exist.
on:
  workflow_dispatch:
  push:
    branches: [feat/job-live-updates]

permissions:
  contents: read

jobs:
  deploy:
    if: ${{ vars.CLOUDFLARE_STAGING_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run build
      - name: Deploy to the staging Worker
        run: bunx wrangler deploy -c wrangler.staging.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
