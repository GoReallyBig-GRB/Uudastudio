name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Type-check, test, and build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Verify Node.js and npm
        run: |
          node --version
          npm --version

      - name: Install dependencies
        run: npm install --include=dev --no-audit --no-fund

      - name: Verify React and TypeScript installation
        run: npm ls --depth=0 react react-dom typescript

      - name: Type-check
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Build application
        run: npm run build:all
