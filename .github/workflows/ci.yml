name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        shell: bash
        run: |
          npm install --no-audit --no-fund 2>&1 | tee /tmp/npm-install.log || {
            echo "::error title=npm install failed::$(grep -E 'npm (error|ERR!)' /tmp/npm-install.log | head -15 | tr '\n' '|' | cut -c1-1500)"
            exit 1
          }
      # Non-blocking until the existing type errors are cleared; then remove continue-on-error
      - run: npm run lint
        continue-on-error: true
      - run: npm test
      - run: npm run build:all
