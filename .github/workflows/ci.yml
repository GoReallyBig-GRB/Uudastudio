name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Type-check, test, and build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Verify Node.js and npm
        run: |
          node --version
          npm --version

      - name: Install dependencies
        run: npm install --include=dev --no-audit --no-fund

      - name: Verify React and TypeScript installation
        run: npm ls --depth=0 react react-dom typescript

      - name: Type-check
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Build application
        run: npm run build:all

  deploy-cloudflare:
    name: Deploy frontend and API proxy to Cloudflare Workers
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.CLOUDFLARE_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install --include=dev --no-audit --no-fund

      - name: Build React application
        run: npm run build

      - name: Deploy to Cloudflare Workers
        run: npm run deploy:cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
